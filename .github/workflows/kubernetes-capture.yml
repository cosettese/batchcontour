name: Capture Kubernetes Job history

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/kubernetes-capture.yml
      - scripts/capture-kubernetes.mbtx
      - examples/kubernetes/capture-cronjob.yaml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: moon update
      - run: kubectl apply -f examples/kubernetes/capture-cronjob.yaml
      - name: Export completed Jobs
        run: moon run --deny-warn scripts/capture-kubernetes.mbtx -- "$RUNNER_TEMP/completed-jobs.json"
      - name: Validate the export with BatchContour
        run: >-
          moon run --deny-warn cmd/batchcontour --target wasm --
          import-kubernetes "$RUNNER_TEMP/completed-jobs.json" candidate batchcontour-capture --min-samples 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: completed-kubernetes-jobs
          path: ${{ runner.temp }}/completed-jobs.json
          if-no-files-found: error
