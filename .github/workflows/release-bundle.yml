name: Verify versioned source bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - .github/workflows/release-bundle.yml
      - moon.mod
      - scripts/verify-distribution.mbtx

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: moon update
      - name: Verify and export source package
        run: |
          mkdir "$RUNNER_TEMP/batchcontour-release"
          moon run --deny-warn scripts/verify-distribution.mbtx all --export "$RUNNER_TEMP/batchcontour-release"
      - name: Verify the exported checksum
        working-directory: ${{ runner.temp }}/batchcontour-release
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: batchcontour-source-bundle
          path: ${{ runner.temp }}/batchcontour-release/
          if-no-files-found: error
