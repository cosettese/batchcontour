name: PR review integration

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review unchanged example
        uses: ./.github/actions/review
        with:
          base-sha: ${{ github.sha }}
          candidate-sha: ${{ github.sha }}
          budget-path: examples/pull-request/budget.json
          plan-path: examples/pull-request/baseline.json
          report-path: ${{ runner.temp }}/batchcontour-passed.json
      - name: Review changed example
        id: blocked
        continue-on-error: true
        uses: ./.github/actions/review
        with:
          base-sha: ${{ github.sha }}
          candidate-sha: ${{ github.sha }}
          budget-path: examples/pull-request/budget.json
          plan-path: examples/pull-request/baseline.json
          candidate-plan-path: examples/pull-request/candidate.json
          policy-path: examples/kubernetes/lenient-policy.json
          report-path: ${{ runner.temp }}/batchcontour-blocked.json
      - name: Check expected block
        if: steps.blocked.outcome != 'failure'
        run: exit 1
      - name: Verify commit isolation
        run: >-
          moon run --deny-warn scripts/verify-pr-review.mbtx --
          "$RUNNER_TEMP/batchcontour-passed.json" "$RUNNER_TEMP/batchcontour-blocked.json"
      - name: Save review reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: example-capacity-reviews
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/batchcontour-passed.json
            ${{ runner.temp }}/batchcontour-blocked.json
