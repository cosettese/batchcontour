apiVersion: v1
kind: Namespace
metadata:
  name: batchcontour-capture
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello
  namespace: batchcontour-capture
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        batch-review: hello
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: hello
              image: busybox:1.37.0
              command: ["sh", "-c", "date -u && sleep 80"]
